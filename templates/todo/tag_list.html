{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-1">Tag List</h1>
    <a href="{% url 'todo:add-tag' %}" class="btn btn-primary">Add Tag</a>
  </div>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>Name</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    {% for tag in tags %}
      <tr>
        <td>{{ tag.name }}</td>
        <td>
          <a href="{% url 'todo:update-tag' tag.id %}" class="btn btn-warning">Update</a>
          <a href="{% url 'todo:delete-tag' tag.id %}" class="btn btn-danger">Delete</a>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
